# Gradle runs on the installed JDK (22) and compiles for Java 21. No toolchains: Gradle must never
# download a JDK, and nothing here asks for one.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.java.installations.auto-download=false

mod_version=1.2.0
minecraft_version=1.21.1
neo_version=21.1.255
