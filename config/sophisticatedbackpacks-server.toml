# Sophisticated Backpacks (kubejs/server_scripts/compat/sophisticated_backpacks.js, docs/design.md: "Sophisticated Backpacks").
# Every TFC item larger than a TFC chest takes (tfc-server.toml, chestMaximumItemSize = LARGE) except tools: anvils, large vessels,
# mold tables, logs, doors, boats, water wheels, windmill blades, sluices, minecarts, the quern, stick bundles and firepit attachments
# (from TFC's item size data, sizes "very_large" and "huge"). Delete the list to drop the rule.
